<style>
:root{--bg:#faf9f5;--card:#fff;--ink:#1f1e1d;--mut:#6b6a64;--line:#e6e3d8;--pri:#1f1e1d;--onp:#faf9f5;--acc:#b5573a;--acc2:#2f6fb0;--ok:#2a7d4f;--ko:#c0303b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#1f1e1d;--card:#2a2927;--ink:#faf9f5;--mut:#a9a79d;--line:#3c3a37;--pri:#faf9f5;--onp:#1f1e1d;--acc:#e08a6a;--acc2:#7ea9dd;--ok:#6ccf97;--ko:#f08a90;color-scheme:dark}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}

h1{font:500 26px/1.2 Georgia,"Times New Roman",serif;margin:6px 0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}

.card.back{background:color-mix(in srgb,var(--acc) 5%,var(--card))}

.card{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}

.card[data-sw="r"]::after{content:"Je savais";right:14px;color:var(--ok)}
.card[data-sw="l"]::after{content:"À revoir";left:14px;color:var(--ko)}
.sb,.sd{display:none}.split{display:flex;flex-direction:column;flex:1}.ct{display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.grid{display:flex;flex-direction:column;gap:10px}

}

    (glissement des cartes, décalage de la feuille au-dessus du clavier) --- */
 .sh{transform-origin:50% 100%;animation:shs .56s var(--spring-soft) backwards,shf .22s ease-out backwards}

/* ===================================================================================
   Liquid Glass, étape 1 : deux composants de test
   .liquid-card : flashcard en révision · .liquid-btn : bouton principal « Réviser » de l'accueil
   Règles : seuls transform / translate / scale / opacity sont animés en continu ;
   le texte reste posé sur un verre presque opaque (contraste intact) ;
   les reflets clairs restent en haut de l'élément, loin du texte centré.
   Les sélecteurs doublent la classe de base (.card / .b.ok) pour passer devant le style injecté plus tard par la couleur d'accent.
   =================================================================================== */
:root{
 --lq-fill:rgb(255 255 255/.74);          /* verre givré : assez opaque pour garder le texte net */
 --lq-fill-back:color-mix(in srgb,var(--acc) 6%,rgb(255 255 255/.78));
 --lq-edge-hi:rgb(255 255 255/.95);       /* liseré : lumière en haut à gauche… */
 --lq-edge-lo:rgb(255 255 255/.28);       /* …qui s'éteint vers le bas */
 --lq-halo:rgb(255 255 255/.62);          /* halo supérieur (reflet « glossy ») */
 --lq-inner-hi:rgb(255 255 255/.7);
 --lq-inner-lo:rgb(70 45 25/.07);         /* volume : fond de la goutte légèrement plus dense */
 --lq-drop:rgb(80 55 35/.2);
 --lq-blur:14px;--lq-r:30px;--lq-float:2px;
 /* bouton : texte clair en mode clair → le bas fonce ; texte foncé en mode sombre → le bas s'éclaircit */
 --lq-btn-mid:color-mix(in srgb,var(--acc),#000 8%);--lq-btn-lo:color-mix(in srgb,var(--acc),#000 16%);--lq-tsh:rgb(0 0 0/.12);
}
:root[data-theme="dark"]{
 --lq-fill:rgb(44 42 40/.8);
 --lq-fill-back:color-mix(in srgb,var(--acc) 7%,rgb(44 42 40/.82));
 --lq-edge-hi:rgb(255 255 255/.34);
 --lq-edge-lo:rgb(255 255 255/.06);
 --lq-halo:rgb(255 255 255/.07);          /* en sombre, un halo clair éteindrait le texte : il reste très discret */
 --lq-inner-hi:rgb(255 255 255/.16);
 --lq-inner-lo:rgb(0 0 0/.28);
 --lq-drop:rgb(0 0 0/.5);
 --lq-btn-mid:color-mix(in srgb,var(--acc),#fff 5%);--lq-btn-lo:color-mix(in srgb,var(--acc),#fff 10%);--lq-tsh:rgb(255 255 255/.14);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --lq-fill:rgb(44 42 40/.8);--lq-fill-back:color-mix(in srgb,var(--acc) 7%,rgb(44 42 40/.82));
 --lq-edge-hi:rgb(255 255 255/.34);--lq-edge-lo:rgb(255 255 255/.06);--lq-halo:rgb(255 255 255/.07);
 --lq-inner-hi:rgb(255 255 255/.16);--lq-inner-lo:rgb(0 0 0/.28);--lq-drop:rgb(0 0 0/.5);
 --lq-btn-mid:color-mix(in srgb,var(--acc),#fff 5%);--lq-btn-lo:color-mix(in srgb,var(--acc),#fff 10%);--lq-tsh:rgb(255 255 255/.14)}}
/* iPad : plus grand, verre plus profond, flottement un peu plus ample */
@media (min-width:768px){:root{--lq-blur:22px;--lq-r:40px;--lq-float:3px}}

/* ---------- .liquid-card ---------- */
.card.liquid-card{
 border:1px solid transparent;border-radius:var(--lq-r);
 /* fond givré dans la zone intérieure, liseré dégradé dans la zone de bordure (épaisseur du verre) */
 background:linear-gradient(var(--lq-fill),var(--lq-fill)) padding-box,
  linear-gradient(150deg,var(--lq-edge-hi),var(--lq-edge-lo) 38%,var(--lq-edge-lo) 70%,color-mix(in srgb,var(--lq-edge-hi) 60%,transparent)) border-box;
 -webkit-backdrop-filter:blur(var(--lq-blur)) saturate(1.5);backdrop-filter:blur(var(--lq-blur)) saturate(1.5);
 box-shadow:
  inset 0 1px 0 var(--lq-inner-hi),                 /* arête supérieure qui accroche la lumière */
  inset 0 22px 32px -26px var(--lq-inner-hi),       /* lumière qui entre par le haut */
  inset 0 -18px 30px -24px var(--lq-inner-lo),      /* densité du liquide en bas */
  0 1px 2px rgb(0 0 0/.04),
  0 22px 44px -24px var(--lq-drop);                 /* l'ombre portée donne le volume */
 transition:scale .62s var(--spring-pop),transform .62s var(--spring),border-radius .55s var(--spring);
}
.card.liquid-card.back{background:linear-gradient(var(--lq-fill-back),var(--lq-fill-back)) padding-box,
  linear-gradient(150deg,var(--lq-edge-hi),var(--lq-edge-lo) 38%,var(--lq-edge-lo) 70%,color-mix(in srgb,var(--lq-edge-hi) 60%,transparent)) border-box}
/* halo supérieur fixe (remplace le reflet d'eau de la carte) : ne recouvre que le haut */
.card.liquid-card:not([data-sw])::before{
 inset:0 0 auto 0;height:46%;opacity:1;
 background:radial-gradient(120% 100% at 30% 0%,var(--lq-halo),transparent 70%);
 -webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;
}
/* toucher : la goutte se déforme légèrement (asymétrique), puis reprend sa forme en ressort */
.card.liquid-card:active{border-radius:calc(var(--lq-r) + 6px) calc(var(--lq-r) - 2px) calc(var(--lq-r) + 4px) calc(var(--lq-r) - 4px)/calc(var(--lq-r) - 2px) calc(var(--lq-r) + 6px) calc(var(--lq-r) - 4px) calc(var(--lq-r) + 4px);
 transition:scale .09s var(--snap),transform .12s var(--snap),border-radius .2s ease-out}
/* pendant le glissement pour noter, la carte bouge à chaque image : on coupe le flou (sinon recalculé en continu) */
.card.liquid-card[data-sw]{-webkit-backdrop-filter:none;backdrop-filter:none}

/* ---------- .liquid-btn ---------- */
.b.ok.liquid-btn{
 position:relative;isolation:isolate;overflow:hidden;
 min-height:60px;border-radius:30px;                 /* iPhone : cible large pour le pouce */
 border:1px solid rgb(255 255 255/.32);
 color:var(--onp);
 /* goutte colorée, plus dense vers le bas ; la bande brillante reste sur le bord supérieur, au-dessus du texte */
 background:
  linear-gradient(180deg,rgb(255 255 255/.22) 0,rgb(255 255 255/.05) 16%,transparent 20%),
  linear-gradient(180deg,var(--acc) 0,var(--lq-btn-mid) 60%,var(--lq-btn-lo));
 box-shadow:
  inset 0 1px 0 rgb(255 255 255/.5),
  inset 0 -4px 10px -2px rgb(0 0 0/.16),
  inset 0 0 0 1px rgb(255 255 255/.06),
  0 2px 6px -2px rgb(0 0 0/.18),
  0 14px 28px -14px color-mix(in srgb,var(--acc) 75%,transparent);
 text-shadow:0 1px 1px var(--lq-tsh);
 will-change:translate;
 animation:lqfloat 5.5s ease-in-out infinite alternate;  /* flottement : translate seulement (composité, sans repeinture) */
 transition:scale .62s var(--spring-pop),transform .62s var(--spring),border-radius .55s var(--spring);
}
@keyframes lqfloat{from{translate:0 0}to{translate:0 calc(var(--lq-float)*-1)}}
html.sho .b.ok.liquid-btn{animation-play-state:paused}
/* onde au toucher : part du doigt (position posée par la « lumière sous le doigt », sinon le centre) */
.b.ok.liquid-btn::after{
 content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
 background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),rgb(255 255 255/.22),rgb(255 255 255/.08) 45%,transparent 70%);
 transform-origin:var(--gx,50%) var(--gy,50%);
 opacity:0;transform:scale(.2);transition:opacity .5s ease-out,transform .55s cubic-bezier(.2,.8,.2,1);
}
.b.ok.liquid-btn:active::after{opacity:1;transform:scale(1.6);transition:opacity .08s linear,transform .4s cubic-bezier(.2,.8,.2,1)}
.b.ok.liquid-btn:active{
 border-radius:34px 26px 32px 28px/28px 34px 26px 32px;
 transition:scale .09s var(--snap),transform .12s var(--snap),border-radius .2s ease-out;
}
.b.ok.liquid-btn>*{position:relative;z-index:1}
@media (hover:hover){.b.ok.liquid-btn:hover{border-radius:32px 28px 33px 27px/27px 33px 28px 32px}}
@media (min-width:768px){
 .b.ok.liquid-btn{min-height:68px;border-radius:34px;font-size:19px}
 .b.ok.liquid-btn:active{border-radius:38px 30px 36px 32px/32px 38px 30px 36px}
}

/* accessibilité et économies */

<script>
const D=[
["Généralités","Qu'est-ce que la méiose ?","Division particulière réalisée **uniquement par les cellules germinales**, composée de **deux divisions successives** avec **une seule réplication de l'ADN**."],
["Généralités","1ère et 2e division méiotique : nature ?","1ère division : **réductionnelle** (aboutit à des cellules **haploïdes**). 2e division : **équationnelle**."],
["Généralités","Quels processus définissent la reproduction sexuée chez les eucaryotes ?","**La méiose et la fécondation**, deux processus **complémentaires**."],
["Généralités","Les deux niveaux de brassage chromosomique ?","**Intrachromosomique** : crossing-over entre homologues (avant). **Interchromosomique** : ségrégation **aléatoire** des paires de chromosomes (de part et d'autre du fuseau)."],
["Généralités","Quelles cellules peuvent entrer en méiose ?","Seulement les **cellules germinales** : **spermatogonies** (homme) et **ovogonies** (femme). Les cellules somatiques en sont incapables."],
["Généralités","Spermatogenèse vs ovogenèse : bilan de la méiose ?","Homme : **continue**, **4 cellules haploïdes fonctionnelles**. Femme : **discontinue**, **un seul gamète** (l'ovocyte, ~140 µm) ; les autres cellules = **globules polaires** (inégal)."],
["Embryogenèse","Origine des cellules germinales ?","Se différencient de l'**épiblaste avant le 18e jour**, autour de l'**allantoïde**, deviennent **gonocytes primordiaux**, migrent vers J25 aux **ébauches gonadiques**. **Origine épiblastique**, pas de différenciation in situ."],
["Spermatogenèse","Que sont les spermatogonies Ad et Ap ?","**Ad** (dark) : se multiplie **sans se différencier** (renouvellement). **Ap** (pale) : se multiplie **4 à 6 fois par mitoses**, puis se différencie en **spermatocytes I**."],
["Spermatogenèse","À quel moment débute la méiose chez l'homme ?","À la **puberté**. **Pas de méiose avant la puberté** chez l'homme. Une fois engagée, elle est **continue**."],
["Spermatogenèse","Spermatocyte I : devenir et durée ?","Devient l'**auxocyte** (grande cellule). **1ère division de méiose ≈ 23 jours** → **2 spermatocytes II**."],
["Spermatogenèse","Spermatocyte II : devenir et durée ?","**2nde division en 24 h** → **2 spermatides**."],
["Spermatogenèse","Qu'est-ce que la spermiogenèse ?","**Maturation** de la spermatide en spermatozoïde (≈ **23 jours**). **Dernière étape** de la spermatogenèse."],
["Spermatogenèse","Durée totale de la spermatogenèse ?","≈ **74 jours chez l'homme** (15 chez le canard)."],
["Spermatogenèse","Comment la maturation des cellules est-elle synchronisée ?","Jusqu'au stade spermatide : **ponts cytoplasmiques de 1 µm** → **syncytium**. Connexion par **contact avec les cellules de Sertoli**."],
["Spermatogenèse","Protéine qui régule la méiose ?","**Protéine Mos**, produite par le gène **c-mos**, un **proto-oncogène**."],
["Ovogenèse","Que se passe-t-il à partir de la 15e semaine embryonnaire ?","Les ovogonies **rompent leurs ponts cytoplasmiques**, s'isolent et s'entourent de **cellules folliculaires** : **follicule primordial** = ovocyte entouré de cellules folliculaires."],
["Ovogenèse","Où et comment la 1ère division de méiose est-elle bloquée chez la femme ?","**In utero**, au **stade diplotène** de la prophase I, en réponse à des facteurs (ex. **AMPc**) sécrétés par les cellules folliculaires."],
["Ovogenèse","Évolution du nombre de follicules ?","**7 millions** (7e mois) → **1 million** (naissance) → **400 000** (puberté) → seulement **≈ 400 ovulations**."],
["Ovogenèse","Qu'est-ce qui déclenche l'ovulation ?","Le **pic de LH** associé à la **libération de progestérone**. Ovule expulsé après 24 à 36 h : **ovocyte II** bloqué en **métaphase II**."],
["Ovogenèse","Blocage en métaphase II : mécanisme moléculaire ?","Le **CSF** (facteur cytostatique, sécrété par l'ovocyte II) **bloque la dégradation des cyclines** qui inhibent le **MPF**. À la fécondation, un **flux de Ca²⁺** inactive le CSF → reprise de la méiose."],
["Ovogenèse","Ménopause : définition et âge ?","**Stock folliculaire épuisé**. Âge moyen ≈ **51 ans**. Précoce si **avant 45 ans** (5 % des femmes)."],
["Hormones","Axe de contrôle hormonal ?","**Hypothalamus** → **GnRH** → **hypophyse** → **FSH** et **LH**."],
["Hormones","Rôle de FSH et LH chez l'homme ?","**FSH** → **spermatogenèse**. **LH** → production de **testostérone**."],
["Mitose / méiose","Les 3 phases de l'interphase ?","**G1** : métabolisme normal. **S** : **réplication de l'ADN** (2N → 4N), seule synthèse d'ADN de la méiose. **G2** : synthèse de protéines et d'organites."],
["Mitose / méiose","Les 5 phases de la mitose ?","**Prophase, métaphase, anaphase, télophase, cytodiérèse** → **2 cellules filles identiques** (2N, 2C), sans brassage."],
["Mitose / méiose","Méiose I : ce qui se passe ?","Les **chromosomes homologues** se séparent **entiers** (4N → 2N), **pas de séparation des chromatides**. Nombre de chromosomes divisé par 2 (2C → C) : cellules **haploïdes**."],
["Mitose / méiose","Méiose II : ce qui se passe ?","Séparation des chromatides (2N → N), **le nombre de chromosomes ne change pas** (C). **Pas de phase S** entre les deux divisions."],
["Mitose / méiose","Les phases de la méiose I ?","**Prophase I** (5 stades), **métaphase I, anaphase I, télophase I**."],
["Méiose féminine","Bilan de la méiose féminine ?","1er blocage : **diplotène (prophase I)**, déblocage **juste avant l'ovulation** → **ovocyte II + 1er globule polaire**. 2e blocage : **métaphase II**, déblocage à la **fécondation** → **ovotide + 2e globule polaire**."],
